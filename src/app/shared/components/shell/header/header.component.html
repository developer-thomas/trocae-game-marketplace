<header
  class="flex h-16 shrink-0 items-center gap-4 border-b border-border bg-bg-secondary px-4 lg:px-6"
>
  <a routerLink="/feed" class="flex items-center gap-2">
    <span class="font-hero text-lg tracking-wide text-accent-cyan">TROCAÊ</span>
  </a>

  <app-game-server-selector class="hidden sm:flex" />

  <div class="relative ml-auto hidden flex-1 max-w-md items-center md:flex">
    <app-icon
      [icon]="searchIcon"
      class="pointer-events-none absolute left-3 text-text-secondary"
    ></app-icon>
    <input
      type="search"
      placeholder="Buscar itens, equipamentos, packs..."
      disabled
      title="Busca ainda não disponível"
      class="w-full rounded-sm border border-border bg-surface py-2 pl-9 pr-3 text-sm
        text-text-primary placeholder:text-text-secondary focus:outline-none
        focus-visible:ring-2 focus-visible:ring-accent-cyan/60 disabled:cursor-not-allowed"
    />
  </div>

  <div class="ml-auto flex items-center gap-2 md:ml-0">
    <button
      type="button"
      disabled
      title="Favoritos ainda não disponíveis"
      class="flex h-9 w-9 items-center justify-center rounded-sm text-text-secondary
        hover:bg-surface disabled:cursor-not-allowed disabled:opacity-40"
    >
      <app-icon [icon]="heartIcon" class="text-lg"></app-icon>
    </button>

    <button
      type="button"
      disabled
      title="Notificações ainda não disponíveis"
      class="flex h-9 w-9 items-center justify-center rounded-sm text-text-secondary
        hover:bg-surface disabled:cursor-not-allowed disabled:opacity-40"
    >
      <app-icon [icon]="notificationsIcon" class="text-lg"></app-icon>
    </button>

    <a
      routerLink="/cadastro"
      class="flex h-9 w-9 items-center justify-center rounded-full border border-border
        bg-surface text-text-secondary hover:border-accent-cyan/50 hover:text-accent-cyan"
      title="Criar conta"
    >
      <app-icon [icon]="personIcon" class="text-lg"></app-icon>
    </a>
  </div>
</header>
