<nav
  class="grid grid-cols-4 border-t border-border bg-bg-secondary"
  style="padding-bottom: env(safe-area-inset-bottom)"
>
  @for (item of items; track item.route + item.label) {
    <a
      [routerLink]="item.disabled ? null : item.route"
      routerLinkActive="text-accent-cyan"
      [class.cursor-not-allowed]="item.disabled"
      [class.opacity-40]="item.disabled"
      class="flex flex-col items-center gap-1 py-2.5 text-text-secondary"
    >
      <app-icon [icon]="item.icon" class="text-xl"></app-icon>
      <span class="text-[11px] font-medium">{{ item.label }}</span>
    </a>
  }
</nav>
